[package]
name = "three-yiddish"
default-run = "3yiddish"
version = "0.2.0"
edition = "2024"
publish = false
license = "CC-BY-NC-SA-4.0"
description = "3Yiddish: modular local language, transcription and speech middleware"

[[bin]]
name = "3yiddish"
path = "src/main.rs"

[dependencies]
qrcode = { version = "0.14", default-features = false }
ratatui = "0.30"
crossterm = "0.29"
unicode-bidi = "0.3"
textwrap = "0.16"
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "1.2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.11"
directories = "6"
whisper-rs = "0.16"
hound = "3.5"
symphonia = { version = "0.6", features = ["all"] }
self-replace = "1.5"
ratatui-image = { version = "11.1.0", default-features = false }
image = { version = "0.25", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = "thin"

# Macs get the Apple GPU (Metal) for speech; other platforms use the CPU for now.
[features]
# GPU through Vulkan (NVIDIA, AMD, Intel) for Windows and Linux; macOS already uses Metal.
vulkan = ["whisper-rs/vulkan"]

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

# Linux mic through PulseAudio/PipeWire (pure-Rust protocol client): ALSA's "default"
# capture device is often unavailable on PipeWire desktops.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }

# Global hold-to-talk key on Windows/macOS. Linux binds keys in the desktop instead, so the
# Linux binary does not need X11 libraries at runtime.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rdev = "0.5"

# Speaker, microphone, key typing and clipboard on computers. Android (Termux) uses the
# Termux:API commands instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
rodio = { version = "0.23", default-features = false, features = ["playback", "recording"] }
enigo = "0.6"
arboard = "3"

[target."cfg(unix)".dependencies]
libc = "0.2"
